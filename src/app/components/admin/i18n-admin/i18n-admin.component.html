<div class="min-h-screen bg-slate-100 flex flex-col">
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center gap-3 justify-between shrink-0">
    <div>
      <h1 class="text-lg font-bold text-slate-900">Traducciones eduCGI</h1>
      <p class="text-xs text-slate-500">
        Valores desde <code class="text-[11px] bg-slate-100 px-1 rounded">assets/i18n</code> —
        al guardar pasan a Firebase y la app los usa desde allí
      </p>
    </div>
    <div class="flex flex-wrap items-center gap-2">
      <span *ngIf="dirtyCount > 0" class="text-xs font-medium text-amber-700 bg-amber-50 px-2 py-1 rounded">
        {{ dirtyCount }} sin guardar
      </span>
      <button
        type="button"
        (click)="saveAll()"
        [disabled]="isSaving || dirtyCount === 0"
        class="text-sm px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 disabled:bg-slate-400">
        {{ isSaving ? 'Guardando…' : 'Guardar en Firebase' }}
      </button>
      <button
        type="button"
        (click)="logout()"
        class="text-sm px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100">
        Salir
      </button>
    </div>
  </header>

  <div
    *ngIf="statusMessage"
    class="mx-4 mt-3 px-4 py-2 rounded-lg text-sm shrink-0"
    [ngClass]="{
      'bg-green-50 text-green-800 border border-green-200': statusType === 'success',
      'bg-red-50 text-red-800 border border-red-200': statusType === 'error',
      'bg-blue-50 text-blue-800 border border-blue-200': statusType === 'info'
    }">
    {{ statusMessage }}
  </div>

  <nav class="bg-white border-b border-slate-200 px-4 flex gap-1 overflow-x-auto shrink-0">
    <button
      *ngFor="let loc of locales"
      type="button"
      (click)="onLocaleChange(loc)"
      class="px-4 py-3 text-sm font-medium border-b-2 whitespace-nowrap transition-colors"
      [ngClass]="
        activeLocale === loc
          ? 'border-blue-600 text-blue-600'
          : 'border-transparent text-slate-600 hover:text-slate-900'
      ">
      {{ localeLabels[loc] }}
    </button>
  </nav>

  <div class="flex flex-1 min-h-0">
    <aside class="w-56 bg-white border-r border-slate-200 shrink-0 overflow-y-auto hidden sm:block">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide px-4 pt-4 pb-2">Sección</p>
      <button
        *ngFor="let ns of namespaces"
        type="button"
        (click)="onNamespaceChange(ns)"
        class="w-full text-left px-4 py-2.5 text-sm flex items-center justify-between gap-2 hover:bg-slate-50"
        [ngClass]="activeNamespace === ns ? 'bg-blue-50 text-blue-700 font-medium' : 'text-slate-700'">
        <span>{{ namespaceLabels[ns] }}</span>
        <span
          *ngIf="dirtyInNamespace(ns) > 0"
          class="text-xs bg-amber-100 text-amber-800 px-1.5 rounded-full">
          {{ dirtyInNamespace(ns) }}
        </span>
      </button>
    </aside>

    <main class="flex-1 flex flex-col min-w-0 p-4">
      <select
        class="sm:hidden mb-3 w-full border border-slate-300 rounded-lg px-3 py-2 text-sm"
        [ngModel]="activeNamespace"
        (ngModelChange)="onNamespaceChange($event)">
        <option *ngFor="let ns of namespaces" [value]="ns">{{ namespaceLabels[ns] }}</option>
      </select>

      <div class="mb-4 flex gap-2">
        <input
          type="search"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange()"
          placeholder="Buscar clave o texto…"
          class="flex-1 px-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
        <span class="text-xs text-slate-500 self-center whitespace-nowrap">
          {{ activeNamespace }} · {{ activeLocale | uppercase }}
        </span>
      </div>

      <div *ngIf="isLoading" class="flex-1 flex items-center justify-center">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600"></div>
      </div>

      <div *ngIf="!isLoading" class="flex-1 overflow-y-auto space-y-4 pb-8">
        <p *ngIf="filteredEntries.length === 0" class="text-slate-500 text-sm text-center py-12">
          No hay entradas en esta sección.
        </p>

        <div
          *ngFor="let entry of filteredEntries"
          class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm"
          [class.ring-2]="entry.dirty"
          [class.ring-amber-300]="entry.dirty">
          <div class="flex items-start justify-between gap-2 mb-2">
            <div class="flex flex-wrap items-center gap-2 min-w-0">
              <label class="text-xs font-mono font-semibold text-slate-500">{{ fieldKey(entry) }}</label>
              <span
                *ngIf="!entry.storedRemotely"
                class="text-[10px] uppercase tracking-wide text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">
                JSON local
              </span>
              <span
                *ngIf="entry.storedRemotely && !entry.dirty"
                class="text-[10px] uppercase tracking-wide text-green-700 bg-green-50 px-1.5 py-0.5 rounded">
                Firebase
              </span>
            </div>
            <button
              *ngIf="entry.dirty"
              type="button"
              (click)="resetEntry(entry)"
              class="text-xs text-slate-500 hover:text-slate-800 shrink-0">
              Deshacer
            </button>
          </div>

          <textarea
            *ngIf="isLongText(entry)"
            [(ngModel)]="entry.value"
            (ngModelChange)="onValueChange(entry)"
            rows="4"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-sans focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></textarea>
          <input
            *ngIf="!isLongText(entry)"
            type="text"
            [(ngModel)]="entry.value"
            (ngModelChange)="onValueChange(entry)"
            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
        </div>
      </div>
    </main>
  </div>
</div>
