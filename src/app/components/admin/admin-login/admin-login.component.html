<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-8">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-900">Panel de traducciones</h1>
      <p class="text-slate-600 text-sm mt-2">Acceso solo para administradores (Supabase Auth)</p>
    </div>

    <div *ngIf="configError" class="bg-amber-50 text-amber-800 px-4 py-3 rounded-lg border border-amber-200 text-sm mb-4">
      Supabase no está configurado. Añade <code class="text-xs">SUPABASE_URL</code> y
      <code class="text-xs">SUPABASE_ANON_KEY</code> en <code class="text-xs">.env.local</code> y ejecuta
      <code class="text-xs">npm run sync-env</code>.
    </div>

    <div *ngIf="errorMessage" class="bg-red-50 text-red-700 px-4 py-3 rounded-lg border border-red-200 text-sm mb-4">
      {{ errorMessage }}
    </div>

    <form (submit)="onSubmit($event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          class="w-full px-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          placeholder="admin@ejemplo.com"
          required
          autocomplete="username" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full px-4 py-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          required
          autocomplete="current-password" />
      </div>
      <button
        type="submit"
        [disabled]="isLoading || configError"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-400 text-white font-semibold py-3 rounded-lg transition-colors">
        {{ isLoading ? 'Entrando…' : 'Entrar al panel' }}
      </button>
    </form>

    <p class="text-xs text-slate-500 mt-6 text-center">
      Crea el usuario en Supabase → Authentication → Users → Add user
    </p>
  </div>
</div>
