<div class="link-generator-container">
  <h1>🔗 Configure Medical Profile</h1>
  <p class="subtitle">Set up your medical parameters for personalized cancer information</p>
  
  <div class="form-section">
    <!-- Tumor Type -->
    <div class="form-group">
      <label for="tumorType">Tumor Type (Oncotree):</label>
      <select id="tumorType" [(ngModel)]="tumorType" name="tumorType">
        <option value="">Select tumor type</option>
        <option *ngFor="let type of tumorTypes" [value]="type">
          {{ type }}
        </option>
      </select>
    </div>

    <!-- Tumor Alteration -->
    <div class="form-group">
      <label>Tumor Alteration:</label>
      <div class="form-row">
        <div class="form-group">
          <label for="alterationGene">Gene:</label>
          <input id="alterationGene" type="text" [(ngModel)]="alterationGene" 
                 name="alterationGene" placeholder="e.g., EGFR, BRCA1, KRAS">
        </div>
        <div class="form-group">
          <label for="alterationType">Mutation Type:</label>
          <select id="alterationType" [(ngModel)]="alterationType" name="alterationType">
            <option value="">Select type</option>
            <option *ngFor="let type of alterationTypes" [value]="type">
              {{ type }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <!-- Treatment -->
    <div class="form-group">
      <label>Treatment:</label>
      <div class="form-row">
        <div class="form-group">
          <label for="treatmentDrug">Drug:</label>
          <input id="treatmentDrug" type="text" [(ngModel)]="treatmentDrug" 
                 name="treatmentDrug" placeholder="e.g., Pembrolizumab, Trastuzumab">
        </div>
        <div class="form-group">
          <label for="treatmentFamily">Family:</label>
          <input id="treatmentFamily" type="text" [(ngModel)]="treatmentFamily" 
                 name="treatmentFamily" placeholder="e.g., PD-1_inhibitor, HER2_inhibitor">
        </div>
        <div class="form-group">
          <label for="treatmentResponse">Response:</label>
          <select id="treatmentResponse" [(ngModel)]="treatmentResponse" name="treatmentResponse">
            <option value="">Select response</option>
            <option *ngFor="let response of responseTypes" [value]="response">
              {{ response }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" (click)="generateLink()">
        🚀 Start Personalized Chat
      </button>
      <button class="btn-secondary" (click)="resetForm()">
        🔄 Reset Form
      </button>
      <button class="btn-tertiary" (click)="goToHome()">
        ← Back to Home
      </button>
    </div>

    <!-- Shareable Link Section -->
    <div *ngIf="tumorType || alterationGene || treatmentDrug" class="share-section">
      <h3>Shareable Link:</h3>
      <div class="link-container">
        <code>{{ generateShareableLink() }}</code>
        <button class="btn-copy" (click)="copyToClipboard()">📋 Copy</button>
      </div>
    </div>
  </div>
</div>
