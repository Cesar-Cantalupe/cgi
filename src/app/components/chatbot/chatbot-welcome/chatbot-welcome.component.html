<div class="flex flex-col gap-6 w-full max-w-4xl mx-auto px-4 py-10 md:py-12 min-h-full">

  <div class="text-left w-full">
    <h1 class="text-4xl md:text-5xl lg:text-6xl font-medium mb-3" 
        style="background: linear-gradient(to right, #CE3262 0%, #CE3262 20%, #37AAC4 60%, #37AAC4 100%); 
               -webkit-background-clip: text;
               -webkit-text-fill-color: transparent;
               background-clip: text;
               color: transparent;
               display: inline-block;">
      {{ 'WELCOME.HELLO' | translate }}
    </h1>
    <p class="text-lg md:text-xl lg:text-2xl text-gray-600 font-light">{{ 'WELCOME.HELP_TODAY' | translate }}</p>
  </div>

  <!-- Input prominente con estilo "New Chat" -->
  <div class="flex items-center gap-3 w-full">
    <textarea [ngModel]="newMessage"
              (ngModelChange)="onInputChange($event)"
              (keydown)="onKeyPress($event)"
              [placeholder]="'CHAT.TYPE_YOUR_QUESTION' | translate"
              class="flex-1 px-6 py-4 border-2 border-[#37AAC4] rounded-2xl text-lg 
                     placeholder:text-[#37AAC4] placeholder:opacity-60 placeholder:font-medium
                     focus:outline-none focus:border-[#CE3262] focus:ring-2 focus:ring-[#CE3262]/20
                     hover:border-[#CE3262] transition-colors resize-none bg-white"
              rows="2"></textarea>
    
    <button (click)="onSend()"
            [disabled]="!newMessage.trim()"
            class="w-14 h-14 border-2 border-[#37AAC4] text-[#37AAC4] rounded-full flex items-center justify-center 
                   hover:border-[#CE3262] hover:text-[#CE3262] hover:bg-[#CE3262]/5 
                   transition-colors bg-white flex-shrink-0
                   disabled:border-gray-300 disabled:text-gray-300 disabled:cursor-not-allowed disabled:opacity-60"
            [attr.title]="'CHAT.SEND_MESSAGE' | translate">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
      </svg>
    </button>
  </div>

  <div class="bg-white border-2 border-[#37AAC4] rounded-3xl p-6 w-full shadow-sm">
    <h3 class="text-lg font-medium text-gray-700 mb-4">{{ 'WELCOME.SUGGESTED_QUESTIONS' | translate }}</h3>
    
    <div class="divide-y divide-[#37AAC4]">        
      <div *ngFor="let question of suggestedQuestions" 
           class="flex items-center justify-between py-3 hover:bg-gray-50 cursor-pointer transition-colors group"
           (click)="onSuggestedQuestionClick(question)">
        <span class="text-gray-700 text-xs md:text-sm">{{ question }}</span>
        <div class="w-6 h-6 rounded-full border-2 border-[#37AAC4] flex items-center justify-center flex-shrink-0 ml-4 group-hover:bg-[#CE3262] group-hover:border-[#CE3262] transition-colors">
          <svg class="w-3 h-3 text-[#37AAC4] group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </div>
      </div>
    </div>
  </div>

</div>
