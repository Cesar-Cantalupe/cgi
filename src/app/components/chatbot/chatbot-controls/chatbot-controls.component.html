<div class="flex items-center gap-2">
  <!-- Botón Regenerate -->
  <button *ngIf="shouldShowRegenerate()"
          (click)="onRegenerate()"
          class="flex items-center justify-center w-8 h-8 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 text-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed relative group"
          [disabled]="isProcessing || (targetMessage?.isStreaming)"
          [attr.title]="regenerateTooltipText">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    <span class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
      {{ regenerateButtonText }}
    </span>
  </button>
  
  <!-- Botón Stop -->
  <button *ngIf="shouldShowStop()"
          (click)="onStop()"
          class="flex items-center justify-center w-8 h-8 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors relative group"
          [attr.title]="stopTooltipText">
    <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="1.5"/>
    </svg>
    <span class="absolute -top-8 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white text-xs rounded py-1 px-2 opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
      {{ stopButtonText }}
    </span>
  </button>
</div>
