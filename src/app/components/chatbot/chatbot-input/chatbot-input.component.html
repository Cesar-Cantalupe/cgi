<div class="bg-white border-t border-gray-100 relative z-20 flex-shrink-0 sticky bottom-0 left-0">

  <!-- Follow-up questions -->
  <div *ngIf="followUpQuestions && followUpQuestions.length > 0 && !isProcessing"
       class="px-4 pt-3 pb-1 flex flex-wrap gap-2 justify-center max-w-4xl mx-auto">
    <button *ngFor="let q of followUpQuestions"
            (click)="onFollowUpClick(q)"
            [disabled]="!isWebSocketConnected"
            class="text-xs px-3 py-1.5 rounded-full border border-[#37AAC4] text-[#37AAC4] bg-white hover:bg-[#37AAC4] hover:text-white transition-colors text-left leading-snug disabled:opacity-40 disabled:cursor-not-allowed max-w-xs truncate"
            [attr.title]="q">
      {{ q }}
    </button>
  </div>

  <div class="flex items-center justify-center mb-2 px-4 pt-1 pb-1">
    <div class="flex items-center space-x-3 w-full max-w-4xl gap-3">
      <textarea #messageInput
                [ngModel]="newMessage"
                (ngModelChange)="onInputChange($event)"
                (input)="autoResize()"
                (keydown)="onKeyPress($event)" 
                [disabled]="!isWebSocketConnected || isProcessing || isStopping"
                [class.overflow-y-auto]="newMessage.length > 0"
                [class.overflow-y-hidden]="newMessage.length === 0"
                class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#37AAC4] focus:ring-1 focus:ring-[#37AAC4] text-sm bg-white disabled:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60 resize-none max-h-32"
                [placeholder]="!isWebSocketConnected ? 
                 ('CHAT.CONNECTING' | translate) : 
                 (isStopping ? ('CHAT.STOPPING' | translate) : 
                 (isProcessing ? ('CHAT.PROCESSING' | translate) : 
                 ('CHAT.TYPE_YOUR_QUESTION' | translate)))"
                rows="1"></textarea>
      
      <button (click)="onSend()"
              [disabled]="!canSend()"
              class="w-12 h-12 border-2 border-[#37AAC4] text-[#37AAC4] rounded-full flex items-center justify-center hover:border-[#CE3262] hover:text-[#CE3262] transition-colors bg-white disabled:border-gray-300 disabled:text-gray-300 disabled:cursor-not-allowed disabled:opacity-60"
              [attr.title]="canSend() ? ('CHAT.SEND_MESSAGE' | translate) : getDisabledTitle()">
         <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
         </svg>
      </button>
    </div>
  </div>   
  <div class="text-center pb-3 px-4">
    <p class="text-xs text-gray-500 mb-1">{{ 'CHAT.DISCLAIMER' | translate }}</p>
    <p class="text-xs mb-1" style="color: #46A8C6;">
      <a routerLink="/legal/terms" class="hover:text-[#CE3262] transition-colors">{{ 'FOOTER.TERMS' | translate }}</a>, 
      <a routerLink="/legal/privacy" class="hover:text-[#CE3262] transition-colors">{{ 'FOOTER.PRIVACY' | translate }}</a>, 
      <a routerLink="/legal/cookies" class="hover:text-[#CE3262] transition-colors">{{ 'FOOTER.COOKIES' | translate }}</a> {{ 'FOOTER.AND' | translate }} 
      <a routerLink="/legal/legal-notice" class="hover:text-[#CE3262] transition-colors">{{ 'FOOTER.LEGAL_NOTICE' | translate }}</a>
    </p>
  </div>
</div>
