<div class="legal-page min-h-screen py-10 md:py-14">
  <div class="max-w-4xl mx-auto px-4 sm:px-6">
    <article class="legal-shell">
      <header class="legal-shell__header">
        <p class="legal-shell__eyebrow">{{ 'LEGAL.DOCUMENT_LABEL' | translate }}</p>
        <h1 class="legal-shell__title">
          {{ getTitle() | translate }}
        </h1>
        <p class="legal-shell__meta">{{ 'LEGAL.ENGLISH_ONLY' | translate }}</p>
      </header>

      <div class="legal-content" [attr.data-type]="pageType">
        <div *ngIf="loading" class="legal-loading" aria-live="polite">
          <span class="legal-loading__dot"></span>
          <span>{{ 'LEGAL.LOADING' | translate }}</span>
        </div>

        <p *ngIf="!loading && loadError" class="legal-error">
          {{ 'LEGAL.PLACEHOLDER_TEXT' | translate }}
        </p>

        <div *ngIf="!loading && !loadError" class="legal-body" [innerHTML]="contentHtml | safeHtml"></div>
      </div>

      <footer class="legal-shell__footer">
        <a routerLink="/home" class="legal-back">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
          </svg>
          {{ 'LEGAL.BACK_HOME' | translate }}
        </a>
      </footer>
    </article>
  </div>
</div>
